<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>声画纪页面切换组件</title>
  <style>
    @font-face {
      font-family: "ShengLishu";
      src: url("./assets/fonts/fz-lishu.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --idle-size: 68px;
      --active-size: 96px;
      --step: 58px;
      --idle-bg: #88754f;
      --active-bg: #e4cea0;
      --idle-text: #2f3030;
      --active-text: #853027;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: transparent; font-family: "ShengLishu", serif;
    }

    .page-switcher {
      position: relative; width: 212px; height: 108px;
      isolation: isolate; user-select: none;
    }

    .switch-item {
      position: absolute; top: 50%; left: 50%; z-index: 1;
      width: var(--idle-size); height: var(--idle-size);
      padding: 0; border: 0; border-radius: 50%;
      color: var(--idle-text); background: var(--idle-bg);
      font-family: inherit; font-size: 18px; line-height: 1;
      cursor: pointer; outline: none;
      transform: translate(calc(-50% + var(--x)), -50%) scale(1);
      transition:
        transform .72s var(--ease),
        width .72s var(--ease),
        height .72s var(--ease),
        color .38s ease,
        background-color .48s ease,
        filter .48s ease;
      will-change: transform, width, height;
    }

    .switch-item::after {
      content: ""; position: absolute; inset: 7px; border-radius: inherit;
      border: 1px solid rgba(255,255,255,0);
      transition: border-color .45s ease, inset .6s var(--ease);
    }

    .switch-item:hover:not(.active) {
      color: #211f1a; filter: brightness(1.07);
      transform: translate(calc(-50% + var(--x)), -50%) scale(1.045);
    }

    .switch-item:focus-visible {
      box-shadow: 0 0 0 3px rgba(228,206,160,.48);
    }

    .switch-item.active {
      z-index: 4; width: var(--active-size); height: var(--active-size);
      color: var(--active-text); background: var(--active-bg);
      font-size: 36px;
      filter: drop-shadow(0 8px 12px rgba(53,39,20,.12));
      transform: translate(calc(-50% + var(--x)), -50%) scale(1);
    }

    .switch-item.active::after {
      inset: 9px; border-color: rgba(255,247,224,.18);
    }

    .switch-item.pressed {
      transform: translate(calc(-50% + var(--x)), -50%) scale(.92);
      transition-duration: .13s;
    }

    @media (prefers-reduced-motion: reduce) {
      .switch-item { transition-duration: .01ms; }
    }
  </style>
</head>
<body>
  <nav class="page-switcher" id="pageSwitcher" aria-label="页面切换">
    <button class="switch-item" type="button" data-page="sound" aria-label="切换到声页面">声</button>
    <button class="switch-item active" type="button" data-page="painting" aria-label="切换到画页面" aria-current="page">画</button>
    <button class="switch-item" type="button" data-page="chronicle" aria-label="切换到纪页面">纪</button>
  </nav>

  <script>
    (() => {
      const switcher = document.getElementById('pageSwitcher');
      const buttons = [...switcher.querySelectorAll('.switch-item')];
      const order = ['sound', 'painting', 'chronicle'];
      const step = 58;

      function layout(activePage, emit = true) {
        const activeIndex = order.indexOf(activePage);

        buttons.forEach((button) => {
          const itemIndex = order.indexOf(button.dataset.page);
          const offset = (itemIndex - activeIndex) * step;
          const isActive = button.dataset.page === activePage;

          button.style.setProperty('--x', `${offset}px`);
          button.classList.toggle('active', isActive);
          button.setAttribute('aria-current', isActive ? 'page' : 'false');
          button.tabIndex = isActive ? 0 : -1;
        });

        if (emit) {
          switcher.dispatchEvent(new CustomEvent('pagechange', {
            bubbles: true,
            detail: { page: activePage }
          }));
        }
      }

      buttons.forEach((button) => {
        button.addEventListener('pointerdown', () => button.classList.add('pressed'));
        button.addEventListener('pointerup', () => button.classList.remove('pressed'));
        button.addEventListener('pointercancel', () => button.classList.remove('pressed'));
        button.addEventListener('click', () => layout(button.dataset.page));
        button.addEventListener('keydown', (event) => {
          if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
          event.preventDefault();
          const current = order.indexOf(button.dataset.page);
          const direction = event.key === 'ArrowRight' ? 1 : -1;
          const nextPage = order[(current + direction + order.length) % order.length];
          layout(nextPage);
          switcher.querySelector(`[data-page="${nextPage}"]`).focus();
        });
      });

      // 外部页面可调用 window.shengPageSwitcher.setPage('sound' | 'painting' | 'chronicle')。
      window.shengPageSwitcher = {
        setPage: (page) => { if (order.includes(page)) layout(page); },
        getPage: () => switcher.querySelector('.active')?.dataset.page
      };

      layout('painting', false);
    })();
  </script>
</body>
</html>
