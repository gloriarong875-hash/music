<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>琴韵千年——古琴制作</title>
<link rel="stylesheet" href="../组件/generalprocess.css">
<link rel="stylesheet" href="qinstyle.css">
</head>
<body>
<div id="canvas">
	<div id="bg-painting"></div>
    <img class="img-layer" id="img-a" src="" alt="">
    <img class="img-layer" id="img-b" src="" alt="">
    <img class="img-extra" id="img-ex0" src="" alt="">
    <img class="img-extra" id="img-ex1" src="" alt="">
    <img class="img-extra" id="img-ex2" src="" alt="">
    <div class="overlay-rect" id="overlay-rect"></div>
    <div class="tilted-rect" id="tilted-rect"></div>
    <div class="text-layer" id="text-a"></div>
    <div class="text-layer" id="text-b"></div>
    <div id="decor-circle"></div>
    <div id="string-panel">
        <div class="string-opt steel" data-type="steel">钢弦</div>
        <div class="string-opt silk" data-type="silk">丝弦</div>
        <div class="string-opt nylon" data-type="nylon">钢丝尼龙弦</div>
    </div>
    <div id="complete-overlay">
        <div class="big">琴成</div>
        <div class="sub">七弦既备 · 千年琴韵</div>
        <div class="btns">
            <button class="complete-btn" id="btn-restart">再次体验</button>
            <button class="complete-btn" id="btn-back">← 返回</button>
        </div>
    </div>
</div>
<div class="progress-bar-top" id="top-progress"></div>
<div id="step-bar">
    <div class="step-item active-step"><div class="step-dot active"></div><div class="step-label">制胚</div></div>
    <div class="step-item"><div class="step-dot pending"></div><div class="step-label">髹漆</div></div>
    <div class="step-item"><div class="step-dot pending"></div><div class="step-label">选弦</div></div>
    <div class="step-item"><div class="step-dot pending"></div><div class="step-label">上弦</div></div>
</div>
<div class="hint" id="scroll-hint" style="position:fixed;bottom:28px;left:50%;transform:translateX(-50%);">↓ 滚轮浏览制作过程</div>

<script src="qin-script.js"></script>
</body>
</html>
